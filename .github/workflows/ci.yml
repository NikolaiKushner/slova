name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # No database is reachable here, and none is needed: the build only
      # constructs the Prisma client, which connects lazily on first query.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-test-secret-at-least-32-characters-long
          AUTH_URL: http://localhost:3000
          AUTH_GOOGLE_ID: ci-client-id
          AUTH_GOOGLE_SECRET: ci-client-secret
